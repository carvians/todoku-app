# =====================================================================
# TodoKu - Docker Compose PRODUKSI
# Dipakai oleh pipeline CD (VPS maupun self-hosted runner).
# Image TIDAK di-build di server, melainkan ditarik dari registry
# dengan tag commit SHA tertentu (IMAGE_TAG) sehingga mudah di-rollback.
# Nilai rahasia dibaca dari file .env di folder deploy.
# =====================================================================
name: todoku

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todoku}
      POSTGRES_USER: ${POSTGRES_USER:-todoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  app:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE wajib diisi}/todoku-api:${IMAGE_TAG:-latest}
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-todoku}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-todoku}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - uploads:/app/uploads
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/todoku-web:${IMAGE_TAG:-latest}
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:
  uploads:
