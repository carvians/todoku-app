# =====================================================================
# TodoKu - Docker Compose (development / uji lokal)
#   3 container: web (Nginx) -> app (Node.js API) -> db (PostgreSQL)
#   Jalankan : docker compose up -d --build
#   Buka     : http://localhost:8080
# =====================================================================
name: todoku

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todoku}
      POSTGRES_USER: ${POSTGRES_USER:-todoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todoku_dev_password}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0-dev}
    image: todoku-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-todoku}:${POSTGRES_PASSWORD:-todoku_dev_password}@db:5432/${POSTGRES_DB:-todoku}
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_ganti_di_produksi_minimal_32_karakter}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - uploads:/app/uploads
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./nginx
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0-dev}
    image: todoku-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [frontend]
    depends_on:
      app:
        condition: service_healthy

# Dua network terpisah: database hanya bisa diakses oleh app,
# tidak bisa dijangkau langsung oleh container web maupun dari luar.
networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:
  uploads:
