# =====================================================================
# Pipeline CI/CD TodoKu (GitHub Actions)
#
#  CONTINUOUS INTEGRATION (setiap push & pull request)
#    1. test        : unit test + integration test dengan PostgreSQL (service container)
#    2. build-e2e   : build 2 image (api & web) -> jalankan stack 3 container
#                     dengan Docker Compose -> smoke test end-to-end -> scan
#                     keamanan image (Trivy) -> push ke GitHub Container Registry
#
#  CONTINUOUS DEPLOYMENT (hanya push ke branch main)
#    3a. deploy-vps         : SSH ke VPS, jalankan scripts/deploy.sh
#    3b. deploy-self-hosted : self-hosted runner (laptop/server kampus)
#    Target dipilih lewat repository variable DEPLOY_TARGET = vps | self-hosted
#    deploy.sh melakukan backup DB, pull image, health check, dan
#    ROLLBACK OTOMATIS jika versi baru gagal.
# =====================================================================
name: CI/CD TodoKu

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Hindari dua deploy berjalan bersamaan; run lama dibatalkan untuk PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 20

jobs:
  # ===================== CI: TEST =====================
  test:
    name: CI · Unit & Integration Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: todoku_test
          POSTGRES_USER: todoku
          POSTGRES_PASSWORD: todoku
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todoku"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Cek sintaks seluruh file JavaScript
        run: |
          find src ../nginx/public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Jalankan test + coverage
        env:
          TEST_DATABASE_URL: postgres://todoku:todoku@localhost:5432/todoku_test
        run: npm test

      - name: Simpan laporan coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage/
          retention-days: 7

  # ===================== CI: BUILD, E2E, PUSH =====================
  build-e2e:
    name: CI · Build Image, E2E Test & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan nama & tag image
        id: meta
        run: |
          NS="${GITHUB_REPOSITORY_OWNER,,}"          # GHCR wajib huruf kecil
          TAG="${GITHUB_SHA::7}"                     # tag = 7 karakter commit SHA
          { echo "namespace=$NS"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          {
            echo "API_IMAGE=$REGISTRY/$NS/todoku-api"
            echo "WEB_IMAGE=$REGISTRY/$NS/todoku-web"
            echo "TAG=$TAG"
            echo "VERSION=2.0.0-$TAG"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image API (stage test di Dockerfile ikut dijalankan)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          load: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.API_IMAGE }}:${{ env.TAG }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build image Web (Nginx)
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          load: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.TAG }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Jalankan stack 3 container (web + app + db)
        run: |
          cat > .env <<EOT
          POSTGRES_PASSWORD=ci_password_$RANDOM
          JWT_SECRET=$(openssl rand -hex 32)
          REGISTRY=$REGISTRY
          IMAGE_NAMESPACE=${{ steps.meta.outputs.namespace }}
          IMAGE_TAG=$TAG
          WEB_PORT=8080
          EOT
          docker compose -f docker-compose.prod.yml --env-file .env up -d --wait --wait-timeout 120
          docker compose -f docker-compose.prod.yml ps

      - name: Smoke test end-to-end melalui Nginx
        run: ./scripts/smoke-test.sh http://localhost:8080 "$TAG"

      - name: Uji persistensi data (restart container app)
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env restart app
          sleep 5
          docker compose -f docker-compose.prod.yml --env-file .env up -d --wait
          curl -fsS http://localhost:8080/api/health

      - name: Tampilkan log jika gagal
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env logs --tail=100

      - name: Hentikan stack
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env down -v

      - name: Ukuran image
        run: docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}' | grep todoku

      - name: Scan kerentanan image API (Trivy)
        # Dijalankan langsung lewat container Trivy resmi agar tidak bergantung pada action pihak ketiga
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            "$API_IMAGE:$TAG"

      - name: Login ke GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image ke registry
        if: github.event_name != 'pull_request'
        run: |
          for img in "$API_IMAGE" "$WEB_IMAGE"; do
            docker push "$img:$TAG"
            docker push "$img:latest"
          done
          {
            echo "### Image dipublikasikan"
            echo "- \`$API_IMAGE:$TAG\`"
            echo "- \`$WEB_IMAGE:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===================== CD: DEPLOY KE VPS =====================
  deploy-vps:
    name: CD · Deploy ke VPS
    runs-on: ubuntu-latest
    needs: build-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_TARGET == 'vps'
    environment:
      name: production
      url: http://${{ vars.APP_HOST }}
    env:
      TAG: ${{ needs.build-e2e.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Salin file deployment ke VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,scripts/deploy.sh,scripts/backup-db.sh,scripts/smoke-test.sh"
          target: ~/todoku

      - name: Deploy (backup DB -> pull -> up -> health check -> rollback jika gagal)
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NS: ${{ needs.build-e2e.outputs.namespace }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAG,POSTGRES_PASSWORD,JWT_SECRET,NS,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd ~/todoku
            chmod +x scripts/*.sh
            umask 077
            cat > .env <<EOT
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            JWT_SECRET=$JWT_SECRET
            REGISTRY=ghcr.io
            IMAGE_NAMESPACE=$NS
            IMAGE_TAG=$TAG
            WEB_PORT=80
            EOT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ./scripts/deploy.sh "$TAG"
            docker logout ghcr.io

      - name: Verifikasi dari internet (smoke test)
        run: ./scripts/smoke-test.sh "http://${{ secrets.VPS_HOST }}" "$TAG"

  # ===================== CD: DEPLOY KE SELF-HOSTED RUNNER =====================
  deploy-self-hosted:
    name: CD · Deploy ke Self-hosted Runner
    runs-on: [self-hosted, todoku]
    needs: build-e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_TARGET == 'self-hosted'
    environment:
      name: production
      url: http://localhost:${{ vars.WEB_PORT || 8080 }}
    env:
      TAG: ${{ needs.build-e2e.outputs.tag }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/todoku-deploy' }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan folder deploy & file .env
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NS: ${{ needs.build-e2e.outputs.namespace }}
          WEB_PORT: ${{ vars.WEB_PORT || 8080 }}
        shell: bash
        run: |
          DIR="${DEPLOY_DIR/#\~/$HOME}"
          mkdir -p "$DIR/scripts"
          cp docker-compose.prod.yml "$DIR/"
          cp scripts/*.sh "$DIR/scripts/"
          chmod +x "$DIR"/scripts/*.sh
          umask 077
          cat > "$DIR/.env" <<EOT
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          REGISTRY=ghcr.io
          IMAGE_NAMESPACE=$NS
          IMAGE_TAG=$TAG
          WEB_PORT=$WEB_PORT
          EOT
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy (backup DB -> pull -> up -> health check -> rollback jika gagal)
        shell: bash
        run: '"$DIR/scripts/deploy.sh" "$TAG"'

      - name: Verifikasi (smoke test)
        shell: bash
        run: ./scripts/smoke-test.sh "http://localhost:${{ vars.WEB_PORT || 8080 }}" "$TAG"
