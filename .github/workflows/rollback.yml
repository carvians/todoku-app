# =====================================================================
# Rollback manual: menjalankan ulang versi image lama (berdasarkan tag
# commit SHA) tanpa build ulang. Dijalankan dari tab Actions ->
# "Rollback TodoKu" -> Run workflow.
# =====================================================================
name: Rollback TodoKu

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image tujuan (7 karakter commit SHA), atau "rollback" untuk versi sebelumnya'
        required: true
        default: rollback

permissions:
  contents: read
  packages: read

jobs:
  rollback-vps:
    name: Rollback di VPS
    if: vars.DEPLOY_TARGET == 'vps'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET: ${{ inputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TARGET,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            cd ~/todoku
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            ./scripts/deploy.sh "$TARGET"

  rollback-self-hosted:
    name: Rollback di Self-hosted Runner
    if: vars.DEPLOY_TARGET == 'self-hosted'
    runs-on: [self-hosted, todoku]
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '~/todoku-deploy' }}
        run: |
          DIR="${DEPLOY_DIR/#\~/$HOME}"
          "$DIR/scripts/deploy.sh" "${{ inputs.image_tag }}"
